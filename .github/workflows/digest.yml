name: ai-abuse-digest

on:
  schedule:
    - cron: "17 * * * *"   # каждый час, на 17-й минуте
  workflow_dispatch:
    inputs:
      query:
        description: "Ручной поиск (пусто = обычный часовой дайджест)"
        required: false
        default: ""

permissions:
  contents: write          # нужно, чтобы коммитить seen.json

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK_HOURS: "25"
          MANUAL_QUERY: ${{ inputs.query }}
        run: python scripts/digest.py

      - name: Run X watch (needs X_BEARER_TOKEN secret, else skipped)
        if: ${{ inputs.query == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/x_watch.py

      - name: Save seen state
        run: |
          git config user.name "abuse-bot"
          git config user.email "abuse-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen state" && git push)
